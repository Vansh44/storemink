  # Custom domains (§ store-domain). DOMAIN_ENV segments the Certificate
  # Manager resource names: staging and prod share ONE certificate map (an
  # HTTPS proxy holds only one, and a single load balancer fronts both), so the
  # environment lives in the NAME, and the delete guard keeps staging from ever
  # removing a prod merchant's entry. DOMAIN_LB_IP is the reserved global
  # address merchants point their A record at — change it here and in the
  # forwarding rule together, or every new connection will be told a stale IP.
  _DOMAIN_ENV: stg
  _DOMAIN_CERT_MAP: prod-cert-map
  _DOMAIN_LB_IP: 136.69.75.127
