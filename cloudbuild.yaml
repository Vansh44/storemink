# Cloud Build CI/CD — build, push, and DEPLOY to Cloud Run, per environment.
#
# Triggered by GitHub pushes; one trigger per branch → environment:
#   dev     branch → service storemink-web-dev   (staging Firebase / DB / bucket)
#
# ⚠ THE STAGING DEPLOYMENT WAS REMOVED 2026-09-08. There is no `staging` branch,
# no `storemink-web` service and no staging.storemink.com — dev is the only
# pre-production environment. The `storemink_staging` DATABASE and Identity
# Platform project REMAIN and are dev's; the comments below about sharing them
# still apply, they simply have one consumer now instead of two.
#   main    branch → service storemink-web-prod  (prod    Firebase / DB / bucket)
#
# Each trigger supplies the per-env substitution VALUES — see docs/gcp-ci-cd.md
# for the exact dev + staging + prod value sets and the one-time IAM/secret setup.
#
# ⚠ DEV AND STAGING SHARE THE `storemink_staging` DATABASE AND THE
# `storemink-staging` Identity Platform PROJECT — deliberately (owner's call).
# dev is a second front-end onto staging's data, not an isolated environment, so
# a destructive test or a migration run against dev IS run against staging.
# Every per-env secret NAME is therefore shared with staging too, and must be:
# PAYMENT_CRED_KEY decrypts BYO-gateway creds stored in that one database, so a
# dev-specific key could not read rows staging wrote (and vice versa).
#
# ⚠ NEXT_PUBLIC_* are BAKED INTO THE IMAGE at build time (they end up in the
# client bundle), so they MUST be passed as build args here. An empty value
# ships a broken bundle — and historically crashed `next build` (an empty
# ROOT_DOMAIN → PLATFORM_URL "https:" → new URL() throws). The code now degrades
# to storemink.com, but the trigger must still pass the real per-env values.

steps:
  # 1. Build + push, with registry-backed Docker layer caching (buildx).
  #    `--cache-to mode=max` exports EVERY stage — including the expensive
  #    `npm ci` deps layer — to a per-env `:buildcache-<tag>` image in Artifact
  #    Registry. A later build whose package-lock.json is unchanged reuses that
  #    layer and skips reinstalling node_modules. `--push` uploads the final
  #    image itself (docker-container driver builds straight to the registry, so
  #    there's NO separate push step and the `images:` block is gone — listing it
  #    would make Cloud Build re-push a non-existent local image and fail).
  #    NEXT_PUBLIC_* are still baked into the client bundle here.
  #    ($$ escapes the $ so Cloud Build leaves the bash expansion for the shell;
  #    the cache tag is derived from _IMAGE, so triggers need no new value.)
  - id: build-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # ★★ COMPATIBILITY SHIM — DELETE ONCE EVERY TRIGGER IS CLEAN.
        # `_MINK_BETA_REQUIRE_INVITE` no longer exists in the app: the store
        # switch is the only Mink access boundary and lib/mink/config.ts pins
        # the flag to true. But this file has no `substitution_option:
        # ALLOW_LOOSE`, so a trigger that still SUPPLIES the key fails the whole
        # build against a template that never mentions it — production would
        # simply stop deploying until somebody remembered a manual step, which
        # is exactly the failure docs/cron-jobs.md keeps recording. Declaring it
        # (empty, below) and reading it here keeps the merge safe on its own and
        # nags in the build log instead of stopping the release.
        if [ -n "${_MINK_BETA_REQUIRE_INVITE}" ]; then
          echo "WARNING: this trigger still sets _MINK_BETA_REQUIRE_INVITE, which does nothing." >&2
          echo "  Clear it with --remove-substitutions (docs/gcp-ci-cd.md), then delete this block." >&2
        fi
        IMAGE="${_IMAGE}"
        CACHE="$${IMAGE%:*}:buildcache-$${IMAGE##*:}"
        docker buildx create --use --name sm --driver docker-container 2>/dev/null \
          || docker buildx use sm
        docker buildx build \
          -t "$${IMAGE}" \
          --push \
          --provenance=false \
          --cache-from "type=registry,ref=$${CACHE}" \
          --cache-to "type=registry,ref=$${CACHE},mode=max" \
          --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}" \
          --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}" \
          --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}" \
          --build-arg "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}" \
          --build-arg "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}" \
          --build-arg "NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}" \
          --build-arg "NEXT_PUBLIC_ROOT_DOMAIN=${_NEXT_PUBLIC_ROOT_DOMAIN}" \
          --build-arg "NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}" \
          .

  # 2. Is this still the newest commit on the branch?
  #
  # ★★ THE ONE GUARD THAT MAKES CONCURRENT MERGES SAFE. Cloud Build does not
  # serialise a trigger, so two merges 30 seconds apart run two builds at once,
  # and whichever finishes LAST wins the deploy. Two things go wrong without
  # this check, and neither reports an error:
  #
  #   1. The older image is deployed last, so old code ends up running against
  #      the newer schema — a silent rollback nobody sees, because both builds
  #      report success.
  #   2. The older build's migrate step reads a ledger containing a migration
  #      its own checkout has never heard of, and assertHealthyPlan throws
  #      "Ledger contains unknown migrations" — a red build for a developer who
  #      did nothing wrong.
  #
  # Both disappear if only the branch tip is allowed to migrate and deploy.
  #
  # ⚠ IT MUST RUN AFTER THE IMAGE BUILD, NOT BEFORE. The race is the tip moving
  # WHILE the slow Docker build runs, so a check at the top of the build answers
  # a question that was still true when it was asked and false by the time it
  # mattered. Checking here wastes one image build on a superseded commit, which
  # is the cheap half of the trade.
  #
  # ⚠ Cloud Build cannot end a build early and green, so this writes a marker
  # and the two steps below no-op on it. A superseded build therefore finishes
  # SUCCESSFULLY having changed nothing — deliberately, because a routinely red
  # build is one the team stops reading.
  - id: tip-check
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail

        # A manual `gcloud builds submit` ships a tarball with no .git and no
        # BRANCH_NAME. That is a deliberate human action, so it is never treated
        # as superseded.
        if [ ! -d .git ] || [ -z "$BRANCH_NAME" ] || [ -z "$COMMIT_SHA" ]; then
          echo "No branch context (manual build) — proceeding."
          exit 0
        fi

        # ★ A FAILED FETCH MUST NOT SKIP THE DEPLOY. We cannot tell "superseded"
        # from "GitHub was briefly unreachable", and silently doing nothing is
        # the worse of the two: the merge would look deployed and would not be.
        if ! git fetch --depth=1 origin "$BRANCH_NAME"; then
          echo "Could not reach origin/$BRANCH_NAME — proceeding rather than skipping." >&2
          exit 0
        fi

        TIP=$$(git rev-parse FETCH_HEAD)
        if [ "$$TIP" = "$COMMIT_SHA" ]; then
          echo "$COMMIT_SHA is the tip of $BRANCH_NAME — releasing."
          exit 0
        fi

        echo "Commit $COMMIT_SHA superseded by $$TIP on $BRANCH_NAME."
        echo "Skipping migrate and deploy; the newer build owns this release."

        # ★ AN UNWRITABLE MARKER MUST FAIL LOUDLY. Without the marker the two
        # steps below would run, and this build would deploy the OLDER image
        # over the newer one — the exact silent rollback this step exists to
        # prevent. A red build is the correct outcome here.
        if ! touch /workspace/superseded; then
          echo "Could not write the superseded marker; failing rather than deploying a stale image." >&2
          exit 1
        fi

  # 3. Apply pending database migrations, BEFORE the code that needs them.
  #
  # ★★ THIS IS WHY NO DEVELOPER NEEDS THE PRODUCTION DATABASE PASSWORD. It used
  # to be `npm run db:migrate:prod apply` on a laptop, which meant either every
  # releasing developer held the postgres SUPERUSER credential or one person was
  # the release bottleneck for the whole team. The build service account already
  # holds secretAccessor on CLOUDSQL_PROD_POSTGRES_PW and cloudsql.client — both
  # granted for cloudbuild-drift.yaml — so this needed no new IAM.
  #
  # ★ MIGRATE BEFORE DEPLOY, and a failure here stops the deploy. The schema is
  # therefore never behind the code. It is deliberately allowed to be AHEAD:
  # every migration must be backward-compatible with the running revision
  # anyway, because Cloud Run serves old and new containers side by side for the
  # length of a rollout. See docs/migrations.md (expand/contract).
  #
  # ⚠ The runner is the SAME code path a human runs, not a second
  # implementation — so its checksum, ordering, environment-name and
  # postcondition guards all still apply here.
  - id: migrate
    name: node:20
    entrypoint: bash
    secretEnv: ["DB_ADMIN_PASSWORD"]
    env:
      - "DB_HOST=127.0.0.1"
      - "DB_PORT=6543"
      - "DB_NAME=${_DB_NAME}"
      - "DB_ADMIN_USER=postgres"
      - "BRANCH=${BRANCH_NAME}"
      - "CLOUDSQL_PROXY_VERSION=${_CLOUDSQL_PROXY_VERSION}"
      - "DB_CONN=${_DB_CONN}"
      # Well under this file's 1800s build timeout, so a stuck concurrent run
      # produces the runner's own actionable message rather than an opaque
      # "build timed out".
      - "MIGRATION_LOCK_WAIT_SECONDS=600"
    args:
      - -c
      - |
        set -euo pipefail

        if [ -f /workspace/superseded ]; then
          echo "Superseded build — not migrating."
          exit 0
        fi

        # Pinned proxy release, not "latest": a release step that silently
        # changes one of its own components is a step whose failures cannot be
        # attributed. Same version as cloudbuild-drift.yaml.
        curl -sSfL -o /workspace/cloud-sql-proxy \
          "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v$${CLOUDSQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
        chmod +x /workspace/cloud-sql-proxy

        # --run-connection-test so an auth or networking failure kills the proxy
        # at startup instead of leaving it LISTENING and resetting every query.
        /workspace/cloud-sql-proxy --port "$${DB_PORT}" --run-connection-test "$${DB_CONN}" &
        PROXY_PID=$$!
        trap 'kill $${PROXY_PID} 2>/dev/null || true' EXIT

        for _ in $$(seq 1 30); do
          if (echo > /dev/tcp/127.0.0.1/$${DB_PORT}) 2>/dev/null; then break; fi
          if ! kill -0 $${PROXY_PID} 2>/dev/null; then
            echo "cloud-sql-proxy exited before accepting connections" >&2
            exit 1
          fi
          sleep 1
        done

        npm ci --omit=dev --no-audit --no-fund

        # ★★ THE ENVIRONMENT IS DERIVED FROM THE DATABASE, NOT CONFIGURED.
        # It was briefly a _MIGRATE_ENV substitution, which meant production
        # deploys silently failed until somebody remembered to set it on the
        # trigger — a release step that has to be remembered per environment is
        # one that gets forgotten, which is the whole lesson of docs/cron-jobs.md.
        # _DB_NAME is already set per trigger and already decides which database
        # the app itself talks to, so it is the value that must be right anyway.
        case "$${DB_NAME}" in
          storemink) MIGRATE_ENV=production ;;
          storemink_staging) MIGRATE_ENV=staging ;;
          *)
            echo "No migration environment maps to database '$${DB_NAME}'." >&2
            echo "Add it here and to ENV_DATABASES in db-migrations-core.mjs." >&2
            exit 1
            ;;
        esac

        # ★★ AND CROSS-CHECKED AGAINST THE BRANCH, which is what deriving would
        # otherwise cost. With two independently-set values (_MIGRATE_ENV and
        # _DB_NAME) the runner's own guard catches a typo in either, because
        # they have to agree. Deriving one from the other loses that — so the
        # branch, which the trigger also fixes, becomes the second opinion: a
        # `main` build may only ever migrate production, and a `dev` build only
        # staging. A wrong _DB_NAME on either trigger is refused here instead of
        # quietly migrating the other environment's database.
        #
        # ⚠ BRANCH is empty on a manual `gcloud builds submit`, which has no
        # branch to check against; the derivation above still applies.
        if [ -n "$${BRANCH}" ]; then
          case "$${BRANCH}:$${MIGRATE_ENV}" in
            main:production | dev:staging) ;;
            *)
              echo "Refusing to migrate $${MIGRATE_ENV} ($${DB_NAME}) from branch $${BRANCH}." >&2
              echo "Check _DB_NAME on this trigger." >&2
              exit 1
              ;;
          esac
        fi

        # The runner demands --confirm-production <database> for a production
        # mutation. Derived from the same one value, so it cannot half-apply.
        CONFIRM=""
        if [ "$${MIGRATE_ENV}" = "production" ]; then
          CONFIRM="--confirm-production $${DB_NAME}"
        fi

        # $COMMIT_SHA is empty on a manual `gcloud builds submit`, and an empty
        # string would be recorded as the ledger's app_commit — worse than a
        # NULL, which honestly says "unknown".
        COMMIT_FLAG=""
        if [ -n "$COMMIT_SHA" ]; then
          COMMIT_FLAG="--commit $COMMIT_SHA"
        fi

        node scripts/db-migrate.mjs status --environment "$${MIGRATE_ENV}"
        node scripts/db-migrate.mjs apply \
          --environment "$${MIGRATE_ENV}" \
          $${COMMIT_FLAG} \
          $${CONFIRM}

  # 4. Deploy to the per-env Cloud Run service (runtime env + secrets + Cloud SQL).
  #    --set-env-vars / --set-secrets REPLACE the full set, so every runtime value
  #    the app needs is listed here. Server secrets stay in Secret Manager.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [ -f /workspace/superseded ]; then
          echo "Superseded build — not deploying; the newer build owns this release."
          exit 0
        fi

        # ⚠ EVERY secret named in --set-secrets must EXIST in Secret Manager
        # before the next deploy — Cloud Run fails the revision outright on a
        # missing one, so adding one here without creating the secret takes the
        # service down.
        gcloud run deploy ${_SERVICE} \
          --image=${_IMAGE} \
          --region=${_RUN_REGION} \
          --service-account=${_RUN_SA} \
          --allow-unauthenticated \
          --port=8080 \
          --min-instances=${_MIN_INSTANCES} \
          --max-instances=${_MAX_INSTANCES} \
          --add-cloudsql-instances=${_DB_CONN} \
          --set-env-vars=DOMAIN_ENV=${_DOMAIN_ENV},DOMAIN_CERT_MAP=${_DOMAIN_CERT_MAP},DOMAIN_LB_IP=${_DOMAIN_LB_IP},GCP_PROJECT_ID=${_GCP_PROJECT_ID},GCP_LOCATION=global,GCS_BUCKET=${_GCS_BUCKET},DB_HOST=/cloudsql/${_DB_CONN},DB_USER=app,DB_NAME=${_DB_NAME},DB_POOL_MAX=${_DB_POOL_MAX},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_SERVICE_ACCOUNT_ID=${_FIREBASE_SA_ID},FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY},GOOGLE_SEARCH_CONSOLE_PROPERTY=${_GOOGLE_SEARCH_CONSOLE_PROPERTY},NEXT_PUBLIC_ROOT_DOMAIN=${_NEXT_PUBLIC_ROOT_DOMAIN},NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL},MINK_AI_ENABLED=${_MINK_AI_ENABLED},MINK_VERTEX_MODEL=${_MINK_VERTEX_MODEL},MINK_VERTEX_LOCATION=${_MINK_VERTEX_LOCATION},MINK_MAX_STEPS_PER_RUN=${_MINK_MAX_STEPS_PER_RUN},MINK_MAX_TOOL_CALLS_PER_RUN=${_MINK_MAX_TOOL_CALLS_PER_RUN},MINK_MAX_PARALLEL_READ_TOOLS=${_MINK_MAX_PARALLEL_READ_TOOLS},MINK_MAX_OUTPUT_TOKENS=${_MINK_MAX_OUTPUT_TOKENS},MINK_MAX_MODEL_RETRIES=${_MINK_MAX_MODEL_RETRIES},MINK_RUN_TIMEOUT_SECONDS=${_MINK_RUN_TIMEOUT_SECONDS} \
          --set-secrets=DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,CRON_SECRET=CRON_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RESEND_WEBHOOK_SECRET=${_RESEND_WEBHOOK_SECRET_SECRET}:latest,PAYMENT_CRED_KEY=${_PAYMENT_CRED_KEY_SECRET}:latest,RAZORPAY_KEY_ID=${_RAZORPAY_KEY_ID_SECRET}:latest,RAZORPAY_KEY_SECRET=${_RAZORPAY_KEY_SECRET_SECRET}:latest,RAZORPAY_WEBHOOK_SECRET=${_RAZORPAY_WEBHOOK_SECRET_SECRET}:latest,POS_SESSION_SECRET=${_POS_SESSION_SECRET_SECRET}:latest

# buildx --push uploads the image directly, so no `images:` block (it would make
# Cloud Build try to re-push a non-existent local image).

# The migrate step needs the postgres SUPERUSER login: migration 0018 revoked
# the app login's grants on schema_migrations, and a durable verify contract
# asserts they stay revoked. Cloud Build is not internet-facing and already
# holds run.admin, so it can already deploy code that reaches this database —
# unlike the Cloud Run runtime, where this credential would be a real downgrade.
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/CLOUDSQL_PROD_POSTGRES_PW/versions/latest
      env: DB_ADMIN_PASSWORD

# npm ci + next build is heavy — and slower on the 2-vCPU free-tier machine — so
# stay well above Cloud Build's 10-min default. Caching (step 1) claws the npm ci
# time back whenever the lockfile is unchanged.
timeout: 1800s

options:
  # No machineType ⇒ the DEFAULT e2-standard-2 (2 vCPU / 8 GB) in the default
  # pool — the ONLY machine covered by Cloud Build's free tier (2,500
  # build-minutes/month; $0.006/min after). e2-medium is cheaper per-minute but
  # gets NO free allocation, so the default is both free AND faster for us. RAM
  # is unchanged from the old E2_HIGHCPU_8 (both 8 GB), so no new OOM risk on
  # `next build` — only fewer vCPUs (8 → 2), i.e. slower, offset by the cache.
  logging: CLOUD_LOGGING_ONLY

# Defaults target STAGING, so a bare `gcloud builds submit` is the safe env.
# The two triggers override these — see docs/gcp-ci-cd.md.
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/storemink-prod/storemink/web:staging
  _SERVICE: storemink-web
  _RUN_REGION: asia-south1
  _RUN_SA: storemink-run@storemink-prod.iam.gserviceaccount.com
  _GCP_PROJECT_ID: storemink-prod
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "4"
  # Mink dashboard agent runtime. The global runtime defaults on, while the
  # store enablement is controlled by one operator-owned database switch.
  # All implemented capabilities follow it, with staff permissions and approvals.
  # Current code always checks the one store-level Mink AI switch. Keep
  # the model and bounded-loop limits declarative here because --set-env-vars
  # replaces the complete Cloud Run environment on every deploy.
  _MINK_AI_ENABLED: "true"
  # ⚠ RETIRED, and declared only so a stale trigger cannot fail the build — see
  # the shim at the top of build-push. Empty is the honest default: nothing
  # reads this value, in this file or in the app. Delete both halves once
  # `--remove-substitutions=_MINK_BETA_REQUIRE_INVITE` has been applied to the
  # dev, staging and prod triggers.
  _MINK_BETA_REQUIRE_INVITE: ""
  _MINK_VERTEX_MODEL: gemini-3.7-flash
  _MINK_VERTEX_LOCATION: global
  _MINK_MAX_STEPS_PER_RUN: "8"
  _MINK_MAX_TOOL_CALLS_PER_RUN: "16"
  _MINK_MAX_PARALLEL_READ_TOOLS: "4"
  _MINK_MAX_OUTPUT_TOKENS: "2048"
  _MINK_MAX_MODEL_RETRIES: "1"
  _MINK_RUN_TIMEOUT_SECONDS: "120"
  # ⚠ THE POOL CEILING IS max-instances × DB_POOL_MAX, AND IT MUST STAY UNDER
  # THE INSTANCE'S max_connections. The shared Cloud SQL instance is
  # `db-f1-micro` (cost — 2026-08-10), whose Postgres default max_connections is
  # ~25; dev, staging and prod ALL connect to it, so the real worst case is the
  # SUM of (max-instances × DB_POOL_MAX) over the three services. At 4×5 each
  # that is 60 — over the ceiling in a simultaneous burst, though far under it at
  # current traffic, where each service sits at 0–1 instances. That arithmetic is
  # why _MAX_INSTANCES is a substitution rather than a hardcoded 4: the dev
  # trigger caps itself at 2 instances × 3 connections = 6, so adding a third
  # environment costs ~15% more headroom rather than another 20 connections.
  # lib/db/client.ts defaults to 10,
  # which would double that, so this is set explicitly rather than left to the
  # code default. If "too many connections" ever appears, this and the tier are
  # the two dials — raise the tier back to db-g1-small (~50) before raising
  # max_connections, which on 0.6 GB of RAM buys errors for OOM kills.
  _DB_POOL_MAX: "5"
  # ⚠ SHARED-INSTANCE MODEL: staging is the `storemink_staging` DATABASE inside
  # the prod instance (storemink-prod-db) — there is no separate staging
  # instance. The database is chosen by _DB_NAME (lib/db/client.ts), NOT by the
  # instance, so the PROD trigger MUST pass _DB_NAME=storemink. If prod ever
  # inherits this staging default it would connect to the STAGING database.
  # Both triggers therefore set _DB_NAME explicitly (see docs/gcp-ci-cd.md).
  _DB_CONN: storemink-prod:asia-south1:storemink-prod-db
  _DB_NAME: storemink_staging
  # Pinned to match cloudbuild-drift.yaml. Both steps read the same ledger; a
  # version drift between them makes a disagreement unattributable.
  _CLOUDSQL_PROXY_VERSION: "2.14.1"
  # One instance ⇒ one cluster-wide `app` role ⇒ one password, so staging
  # authenticates with the prod instance's app secret. (Optional hardening
  # before real customers: a restricted `app_staging` role with its own secret
  # + a _DB_USER substitution, so staging creds physically cannot reach the
  # prod database.)
  _DB_PASSWORD_SECRET: CLOUDSQL_PROD_APP_PW
  # Payments + Razorpay — per-env VALUES via env-specific secret NAMES. Secret
  # Manager is per-project and staging+prod share the storemink-prod project, so
  # a value differs only by pointing at a *_STAGING vs *_PROD secret (same trick
  # as _DB_PASSWORD_SECRET). Defaults target STAGING = Razorpay TEST keys; the
  # PROD trigger overrides all four to the *_PROD secrets = Razorpay LIVE keys.
  # PAYMENT_CRED_KEY intentionally differs per env (a leaked staging key must not
  # decrypt prod-stored BYO-gateway creds). The naming looks doubled
  # (…_KEY_SECRET_SECRET) because the env var itself ends in _SECRET and the
  # substitution suffix _SECRET means "the Secret Manager name for this var".
  _PAYMENT_CRED_KEY_SECRET: PAYMENT_CRED_KEY_STAGING
  _RAZORPAY_KEY_ID_SECRET: RAZORPAY_KEY_ID_STAGING
  _RAZORPAY_KEY_SECRET_SECRET: RAZORPAY_KEY_SECRET_STAGING
  _RAZORPAY_WEBHOOK_SECRET_SECRET: RAZORPAY_WEBHOOK_SECRET_STAGING
  # Resend's Svix signing secret for /api/webhooks/resend — how the app learns
  # about hard bounces and complaints (CODEBASE §24). Per-env because it is per
  # ENDPOINT: staging and prod register different URLs in the Resend dashboard
  # and each gets its own `whsec_…`. RESEND_API_KEY above is NOT per-env (one
  # account, one key), which is why only this half is substituted.
  # Without it the route logs a warning and drops every delivery event, so
  # `email_suppressions` stays empty and dead addresses are mailed forever on a
  # sending domain whose reputation is shared by every store — the failure is
  # silent, which is what kept it unnoticed until 2026-08-01.
  _RESEND_WEBHOOK_SECRET_SECRET: RESEND_WEBHOOK_SECRET_STAGING
  # POS device/operator cookie signing key (lib/pos/session.ts). Per-env for the
  # same reason as PAYMENT_CRED_KEY: this key MINTS register credentials, so a
  # leaked staging value must not forge a pos_device cookie against prod.
  # Without it every POS credential mint fails — "Authorize this device" and
  # cashier PIN login both 500 (staging ran this way until 2026-07-27).
  _POS_SESSION_SECRET_SECRET: POS_SESSION_SECRET_STAGING
  _GCS_BUCKET: storemink-media
  _FIREBASE_PROJECT_ID: storemink-staging
  # The Firebase project's own firebase-adminsdk SA — the SIGNER for custom
  # tokens / session cookies (see lib/auth/firebase-admin.ts). Per-env.
  _FIREBASE_SA_ID: firebase-adminsdk-fbsvc@storemink-staging.iam.gserviceaccount.com
  # Firebase web config is PUBLIC (it ships in the client bundle) — not secret.
  # The apiKey is left blank here only to keep GitHub secret-scanning quiet; the
  # triggers always pass the real per-env values via --substitutions (see
  # docs/gcp-ci-cd.md). A bare `gcloud builds submit` must pass it explicitly.
  _NEXT_PUBLIC_FIREBASE_API_KEY: ""
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: storemink-staging.firebaseapp.com
