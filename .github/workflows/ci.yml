name: Next.js CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# ★★ A SUPERSEDED RUN IS CANCELLED. Two pushes 22 seconds apart used to produce
# two complete 27-minute runs (34834587449 and 34834617499, both finishing at
# 11:10) — 54 billed minutes for one answer nobody read, because only the newer
# commit's result matters. Safe here because this workflow DEPLOYS NOTHING: the
# Cloud Build triggers own that (cloudbuild.yaml), so cancelling a run of it
# cannot leave anything half-finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ★★ FOUR PARALLEL JOBS, NOT ONE SEQUENTIAL ONE. Measured on run 34834617499,
# the single job took 26.7 minutes and the two test invocations were 79% of it
# (669s + 591s of 1603s). Nothing here depends on anything else here — lint does
# not need the build, the build does not need the tests — so running them in
# sequence bought nothing but wall clock.
#
# ⚠ IT COSTS A LITTLE MORE BILLED TIME, and that is the trade: each job pays its
# own checkout + `npm ci` (~45s). Wall clock is the LONGEST job instead of the
# sum, so the extra minutes buy roughly four times less waiting. The
# concurrency group above more than pays for it on any branch that gets two
# pushes in a row.
#
# ⚠ KEEP THE JOBS INDEPENDENT. Adding `needs:` to chain them re-introduces the
# sequence this split exists to remove. If a job ever genuinely needs another's
# output, it needs an artifact, not an ordering.
jobs:
  checks:
    name: Lint, types and content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      # ★ MIGRATION SQL IS REVIEWED BY A MACHINE BEFORE A HUMAN. Every
      # migration must be backward-compatible with the revision it replaces,
      # because Cloud Run runs old and new containers against one database for
      # the length of a rollout. This blocks the mechanical half of that rule —
      # dropped, renamed or retyped columns, and NOT NULL added with no default
      # — in the pull request, where the cost is a comment rather than an
      # outage. See docs/migrations.md.
      - name: Migration Lint
        run: npm run db:lint

      # ★ HELP CENTRE GUIDES ARE FOR MERCHANTS. AGENTS.md used to require that
      # every change update the Help Centre, so 85 of the first 98 migrations
      # appended to a guide and one reached 69 KB of engineering phases,
      # environment-variable names, a platform-only switch and a `gcloud`
      # command. This blocks that vocabulary, and blocks published wording
      # asserted in a DURABLE verify block — which freezes the copy forever,
      # because that block is re-checked every run and is part of the
      # migration's checksum. See docs/help-centre.md.
      - name: Help Content Lint
        run: npm run help:lint

      - name: Format Check
        run: npm run prettier --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test

  shuffle:
    name: Test order independence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ★★ CATCHES ORDER-DEPENDENT TESTS, which `npm run test` cannot: it runs
      # files in declaration order, so a test that only passes because it happens
      # to run before another one looks permanently green. Three did (fixed
      # 2026-08-13, commit a10bbed) — all from `vi.clearAllMocks()` clearing CALLS
      # but not IMPLEMENTATIONS, so a mockResolvedValue leaked forward. One of
      # them hid a razorpay suite charging 150 for a 200 order.
      #
      # ★ STILL EARNS ITS PLACE AFTER `mockReset: true`. That config flag
      # (vitest.config.ts) closes the dominant CAUSE — a stubbed implementation
      # reaching a test that never asked for one — but not the category:
      # module-level mutable state, shared fixtures and `vi.hoisted` holders
      # still couple one test to another, and only a different file order can
      # show that.
      #
      # ★ FIXED SEED, deliberately. A random seed explores more permutations, but
      # it makes the suite non-deterministically red — and a red that comes and
      # goes teaches people to re-run rather than to trust it, which is the exact
      # failure vitest.config.ts's exclude comment already records. A fixed seed
      # gives one ordering that is NOT declaration order and is reproducible on
      # demand, so a failure here is always actionable.
      #
      # ⚠ WHAT IT DOES NOT DO: one seed is one permutation. It will not find every
      # order-dependence, only regressions that this ordering happens to expose.
      # To hunt for more, run vitest DIRECTLY with another seed:
      #
      #   npx vitest run --coverage=false --sequence.shuffle --sequence.seed=777
      #
      # Not `npm run test:shuffle -- --sequence.seed=777`: the script already
      # passes a seed, and vitest rejects the duplicate ("Expected a single value
      # for option --sequence.seed"). Vitest prints the seed it used, so any
      # failure — here or locally — is reproducible from the log.
      #
      # No coverage here (--coverage=false in the script): the `test` job above
      # already measured it, and instrumenting twice doubles the slowest step for
      # nothing.
      - name: Test Order Independence
        run: npm run test:shuffle

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # CI verification only — catches build breaks before deploy. Deploys are
      # OWNED by the Cloud Build triggers (cloudbuild.yaml): staging -> service
      # storemink-web, main -> storemink-web-prod. They are the ONLY path that
      # bakes the NEXT_PUBLIC_* build args (e.g. NEXT_PUBLIC_ROOT_DOMAIN) into
      # the client bundle and wires runtime env/secrets/Cloud SQL. See
      # docs/gcp-ci-cd.md.
      #
      # Do NOT add a `gcloud run deploy --source` / deploy-cloudrun step here:
      # a source deploy CANNOT pass Docker build args, so it ships an empty
      # NEXT_PUBLIC_ROOT_DOMAIN and (finishing after the Cloud Build trigger)
      # clobbers the good revision — which broke staging (apex resolved as a
      # store slug "staging"; /dashboard fell back to the WholeSip store).
      - name: Build Project
        run: npm run build
